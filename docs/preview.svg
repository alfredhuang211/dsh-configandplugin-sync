<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">Two devices exchanging a sync plan through a remote store</title>
  <desc id="d">A left device and a right device each hold three labelled blocks. Arrows run from each device toward a central cylinder standing for the remote store. One block above the left device is drawn as a pending change, outlined rather than filled.</desc>

  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="url(#plane)"/>

  <!-- left device -->
  <rect x="40" y="96" width="132" height="108" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="56" y="112" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="56" y="136" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="56" y="160" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="56" y="184" width="60" height="10" rx="3" fill="currentColor" fill-opacity="0.12"/>

  <!-- right device -->
  <rect x="468" y="96" width="132" height="108" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="484" y="112" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="484" y="136" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="484" y="160" width="100" height="16" rx="4" fill="currentColor" fill-opacity="0.22"/>
  <rect x="484" y="184" width="72" height="10" rx="3" fill="currentColor" fill-opacity="0.12"/>

  <!-- remote store: a cylinder -->
  <ellipse cx="320" cy="112" rx="62" ry="18" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M258 112 V196 A62 18 0 0 0 382 196 V112" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M258 148 A62 18 0 0 0 382 148" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M258 172 A62 18 0 0 0 382 172" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="2"/>

  <!-- upload: left device to store -->
  <path d="M182 134 C 220 134, 232 128, 250 126" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2" marker-end="url(#head)"/>
  <!-- download: store to right device -->
  <path d="M390 166 C 418 168, 438 172, 460 172" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2" marker-end="url(#head)"/>

  <!-- pending change on the left: outlined, not filled -->
  <rect x="56" y="60" width="100" height="20" rx="5" fill="none" stroke="currentColor" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M106 84 V92" stroke="currentColor" stroke-opacity="0.4" stroke-width="2"/>

  <!-- confirmed on the right: check inside a filled disc -->
  <circle cx="534" cy="70" r="13" fill="currentColor" fill-opacity="0.16"/>
  <path d="M528 70 L532 75 L541 65" fill="none" stroke="currentColor" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- baseline -->
  <path d="M40 232 H600" stroke="currentColor" stroke-opacity="0.16" stroke-width="2"/>
</svg>
